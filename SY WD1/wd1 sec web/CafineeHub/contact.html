<div class="page-title">

    <h1>Contact Us</h1>

</div>


<div class="container my-5">

    <div class="row">


        <div class="col-md-6">

            <h2>Contact Information</h2>

            <p>
                <strong>Address:</strong>
                Surat, Gujarat
            </p>

            <p>
                <strong>Phone:</strong>
                +91 98*** ***10
            </p>

            <p>
                <strong>Email:</strong>
                cafineehub@gmail.com
            </p>

            <p>
                <strong>Opening Time:</strong>
                9:00 AM to 10:00 PM
            </p>

        </div>


        <div class="col-md-6">

            <h2>Send Message</h2>

            <form onsubmit="return validateForm()">

                <div class="mb-3">

                    <label>Name</label>

                    <input type="text"
                           id="name"
                           class="form-control">

                </div>


                <div class="mb-3">

                    <label>Email</label>

                    <input type="email"
                           id="email"
                           class="form-control">

                </div>


                <div class="mb-3">

                    <label>Message</label>

                    <textarea id="message"
                              class="form-control"
                              rows="4">
                    </textarea>

                </div>


                <button type="submit"
                        class="btn btn-dark">

                    Submit

                </button>

            </form>

        </div>

    </div>

</div>
